[project]
name = "screen-workflow-teacher"
version = "0.1.0"
description = "A desktop workflow recorder and replay assistant."
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7.0",
  "pynput>=1.7.7",
  "pyautogui>=0.9.54",
  "mss>=9.0.1",
  "Pillow>=10.3.0",
  "pytesseract>=0.3.10",
  "psutil>=5.9.8"
]

[tool.ruff]
line-length = 100
